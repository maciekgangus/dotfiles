# ~/.tmux.conf  (symlink -> ~/dotfiles/terminal-setup/tmux.conf)
# Catppuccin Mocha, hand-written status bar (no theme plugin, no shell calls).

# ── terminal ───────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:usstyle:clipboard"
set -as terminal-features ",xterm-256color:RGB"
set -g set-clipboard on
set -gq allow-passthrough on

# ── behaviour ──────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 10
setw -g aggressive-resize on
setw -g mode-keys vi

# window name = folder when idle at a shell, command name when something runs
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# per-program window icon (Nerd Font); folder icon when idle at a shell
set -g @wicon '#{?#{==:#{pane_current_command},nvim}, ,#{?#{==:#{pane_current_command},vim}, ,#{?#{==:#{pane_current_command},python3}, ,#{?#{==:#{pane_current_command},python}, ,#{?#{==:#{pane_current_command},ssh},󰣀 ,#{?#{==:#{pane_current_command},docker}, ,#{?#{==:#{pane_current_command},node}, ,#{?#{==:#{pane_current_command},claude},󰚩 ,#{?#{==:#{pane_current_command},btop}, ,#{?#{==:#{pane_current_command},htop}, ,#{?#{==:#{pane_current_command},lazygit}, ,#{?#{==:#{pane_current_command},git}, ,#{?#{==:#{pane_current_command},cargo}, ,#{?#{==:#{pane_current_command},go}, ,#{?#{==:#{pane_current_command},yazi}, ,#{?#{==:#{pane_current_command},man}, , }}}}}}}}}}}}}}}}'

# ── keys (prefix stays C-b) ────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind r source-file ~/.tmux.conf \; display "Przeładowano!"

# ── colours: Catppuccin Mocha ──────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
set -g message-style "bg=#cba6f7,fg=#11111b,bold"
set -g message-command-style "bg=#cba6f7,fg=#11111b"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#cba6f7"
set -g clock-mode-colour "#cba6f7"

# left: session pill (shows "main" even inside a Ghostty-tab session)
set -g status-left "#[fg=#cba6f7,bg=#181825]#[fg=#11111b,bg=#cba6f7,bold] #{?session_group,#{session_group},#S} #[fg=#cba6f7,bg=#181825] "

# window tabs
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#313244,bg=#181825]#[fg=#a6adc8,bg=#313244] #I #{E:@wicon}#W #[fg=#313244,bg=#181825]"
setw -g window-status-current-format "#[fg=#89b4fa,bg=#181825]#[fg=#11111b,bg=#89b4fa,bold] #I #{E:@wicon}#W#{?window_zoomed_flag, Z,} #[fg=#89b4fa,bg=#181825]"
setw -g window-status-bell-style "fg=#f38ba8,bold"
setw -g window-status-activity-style "fg=#f9e2af"

# right: prefix indicator + clock
set -g status-right "#{?client_prefix,#[fg=#f38ba8 bg=#181825]#[fg=#11111b bg=#f38ba8 bold] PREFIX #[fg=#f38ba8 bg=#181825] ,}#(~/.local/bin/claude-usage-segment)#[fg=#313244,bg=#181825]#[fg=#cdd6f4,bg=#313244] %a %d %b  %H:%M #[fg=#313244,bg=#181825]"

# ── plugins (kept minimal: persistence only) ───────────────────────────────
# restore is done by tmux-start, only on a cold server start -> continuum
# just does the periodic auto-save, so no more duplicated windows.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'
run '~/.tmux/plugins/tpm/tpm'
