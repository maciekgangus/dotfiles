"$schema" = 'https://starship.rs/config-schema.json'

# Two-line prompt, no right prompt (clock/usage live in the tmux status bar).
# Line 1: context. Line 2: just the character. Transient prompt is in zshrc.
add_newline = true
command_timeout = 800

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$java\
$terraform\
$kubernetes\
${env_var.AWS_PROFILE}\
$cmd_duration
$character"""

palette = 'mocha'

[palettes.mocha]
blue = '#89b4fa'
green = '#a6e3a1'
red = '#f38ba8'
yellow = '#f9e2af'
peach = '#fab387'
mauve = '#cba6f7'
teal = '#94e2d5'
overlay = '#6c7086'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

[directory]
style = 'bold blue'
truncation_length = 3
truncate_to_repo = true
read_only = ' 󰌾'

[git_branch]
symbol = ' '
style = 'mauve'
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style = 'peach'
format = '([$all_status$ahead_behind]($style) )'

[git_state]
style = 'yellow'

[cmd_duration]
min_time = 5000
style = 'overlay'
format = '[took $duration]($style) '

# --- Python (main language): venv / pyenv name instead of interpreter spam ---
[python]
symbol = ' '
style = 'yellow'
pyenv_version_name = true
format = '[${symbol}(${version} )(\($virtualenv\) )]($style)'

# --- Other languages: only in matching projects, version only ---
[nodejs]
symbol = ' '
style = 'green'
format = '[$symbol($version )]($style)'

[rust]
symbol = ' '
style = 'peach'
format = '[$symbol($version )]($style)'

[golang]
symbol = ' '
style = 'teal'
format = '[$symbol($version )]($style)'

[java]
symbol = ' '
style = 'red'
format = '[$symbol($version )]($style)'

# --- Infra ---
[terraform]
symbol = '󱁢 '
style = 'mauve'
format = '[$symbol$workspace]($style) '

# Always on (CKA practice). To show only in k8s dirs, set detect_files below.
[kubernetes]
disabled = false
symbol = '󱃾 '
style = 'blue'
format = '[$symbol$context(/$namespace)]($style) '

# AWS: shown ONLY when AWS_PROFILE is explicitly set (not just because ~/.aws exists).
[aws]
disabled = true

[env_var.AWS_PROFILE]
variable = 'AWS_PROFILE'
symbol = ' '
style = 'yellow'
format = '[$symbol$env_value]($style) '

# --- Noise: off ---
[package]
disabled = true

[docker_context]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true
