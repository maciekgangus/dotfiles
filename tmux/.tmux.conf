# --- PODSTAWY ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g status-position top
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g status-interval 5

# --- NAZWY ZAKŁADEK ---
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{pane_current_command}"

# --- SKRÓTY ---
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.tmux.conf \; display "Przeładowano!"

# --- ŚRODOWISKO ---
set-option -g default-command "/bin/zsh"
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"

# --- CATPPUCCIN ---
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_cpu_text "#(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)"
set -g @catppuccin_cpu_color "#{@thm_yellow}"

# --- ZAŁADUJ CATPPUCCIN ---
run "/opt/homebrew/bin/bash ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"

# --- STATUS BAR ---
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"

# Ręczny status-right z hardkodowanymi kolorami catppuccin mocha
set -g status-right "#[fg=#1e1e2e,bg=#a6e3a1]   #[fg=#a6e3a1,bg=#313244] #(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh) "
set -ag status-right "#[fg=#1e1e2e,bg=#f9e2af]   #[fg=#f9e2af,bg=#313244] #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) "
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set-environment -g PATH "/usr/sbin:/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"
# --- TPM ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
run "/opt/homebrew/bin/bash ~/.tmux/plugins/tpm/tpm"
set -gq @catppuccin_window_text " #W"
set -gq @catppuccin_window_current_text " #W"
